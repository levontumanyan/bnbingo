[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bnbingo"
dynamic = ["version"]
description = "Search, verify, and score Airbnb stays against your own criteria"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
	{name = "Levon Tumanyan"},
]
dependencies = [
	"pyairbnb>=2.2.9",
	"geopy>=2.4.1",
	"python-dotenv>=1.0.1",
	"tqdm>=4.66.0",
	"cryptography>=42.0.0",
]

[project.scripts]
bnbingo = "bnbingo.main:main"

[project.urls]
Homepage = "https://github.com/levontumanyan/bnbingo"
Repository = "https://github.com/levontumanyan/bnbingo"
Issues = "https://github.com/levontumanyan/bnbingo/issues"

[dependency-groups]
dev = [
	"pytest>=9.0.3",
	"pytest-mock>=3.15.1",
	"ruff>=0.15.11",
]

[tool.hatch.version]
path = "bnbingo/__init__.py"

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.ruff.lint]
select = ["F", "E", "ISC", "I"]
ignore = ["E501"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
