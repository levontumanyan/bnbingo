[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bnbingo"
version = "0.1.0"
description = "Search, verify, and score Airbnb stays against your own criteria"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"pyairbnb>=2.2.9",
	"geopy>=2.4.1",
	"python-dotenv>=1.0.1",
	"tqdm>=4.66.0",
	"cryptography>=42.0.0",
]

[project.scripts]
bnbingo = "bnbingo.main:main"

[tool.setuptools]
packages = ["bnbingo"]

[tool.setuptools.package-data]
bnbingo = ["amenities.json"]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.ruff.lint]
select = ["F", "E", "ISC", "I"]
ignore = ["E501"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[lint.isort]
combine-as-imports = true

[dependency-groups]
dev = [
	"pytest>=9.0.3",
	"pytest-mock>=3.15.1",
	"ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
